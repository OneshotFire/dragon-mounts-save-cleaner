<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Remove known Dragon Mounts entries from a Dragonwilds character save. Your save is processed locally in your browser.">
  <meta name="theme-color" content="#19221c">
  <link rel="icon" href="dragon.png" type="image/png">
  <link rel="stylesheet" href="style.css?v=2">
  <title>Dragon Mounts Save Cleaner</title>
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main>
    <section class="workbench" aria-label="Save cleaner">
      <header class="heading">
        <div class="dragon-portrait" aria-hidden="true"><img src="dragon.png" alt="" width="936" height="1109"></div>
        <div><p class="brand">Dragon Mounts</p><h1>Save cleaner</h1></div>
      </header>
      <p class="intro">Remove only Dragon Mounts data from your character save.</p>
      <div id="drop-zone" class="drop-zone">
        <h2>Drop your character .json here</h2>
        <button id="choose-file" class="button primary" type="button">Choose save</button>
        <input id="file-input" type="file" accept=".json,application/json" hidden>
        <p class="small">Your save stays on your device.</p>
      </div>

      <div id="status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <section id="results" aria-labelledby="results-title" hidden>
        <div class="file-row"><span id="file-name"></span><button id="clear-file" class="text-button" type="button">Clear file</button></div>
        <div class="result-heading"><span id="result-symbol" aria-hidden="true">✓</span><h2 id="results-title"></h2></div>
        <p id="result-description"></p>
        <p id="verified" class="verified"></p>
        <details id="change-details">
          <summary id="changes-summary">View changes</summary>
          <ul id="changes-list" class="changes"></ul>
        </details>
        <div id="downloads" class="download-area" hidden>
          <div class="actions">
            <button id="download-cleaned" class="button primary" type="button">Download cleaned save</button>
            <button id="download-backup" class="button secondary" type="button">Download backup</button>
            <button id="download-report" class="text-button" type="button">Report</button>
          </div>
          <p class="small">Close the game before replacing your save. Use its original filename.</p>
        </div>
      </section>
    </section>

    <footer><span>Your original file stays unchanged.</span><span id="version"></span></footer>
    <noscript><p class="noscript">Enable JavaScript to process the save locally in your browser.</p></noscript>
  </main>
</body>
</html>
